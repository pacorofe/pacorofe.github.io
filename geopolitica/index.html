<style>
/* Layout: carta náutica a pantalla completa; mapa + panel de fichas (lateral en escritorio, inferior en móvil) */
:root{
  --sea:#d9e4e6; --land:#f6f6f1; --land-h:#e9ede4; --border:#a3aeae; --grat:#c5d3d6;
  --ink:#15232a; --muted:#56676d; --panel:#fcfcfa; --line:#d6dedd; --chip:#eef2f1;

  --war:#c4372b; --tension:#cf8410; --choke:#0d5a69; --sea-route:#2c66ad; --corr:#7347a8;
  --pipe:#5b3f25; --gaspipe:#2a7fa8; --cable:#ad327f; --hist:#8a6526; --vote:#4a3cb3; --t-space:#4338ca; --t-ai:#c2410c; --t-qc:#0d9488; --t-cyber:#be123c;
  --b-us:#2c55a8; --b-cn:#c4372b; --b-ru:#6b3a8e; --b-eu:#0d7a72; --b-in:#7a7a12;
  --r-ali:#2f8a52; --r-soc:#2c66ad; --r-ten:#cf8410; --r-riv:#c4372b; --r-gue:#7d1610;
  --f-disp:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Source Serif 4',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sea:#0a1820; --land:#1b2a31; --land-h:#24363e; --border:#3d525b; --grat:#13262f;
  --ink:#e3ebec; --muted:#93a5ab; --panel:#0f1e25; --line:#22353d; --chip:#18292f;
  --accent:#62b8c7; --accent-soft:#1d4a53; --bloc:#2c6470; --sel:#62b8c7;
  --war:#ff6253; --tension:#f2a634; --choke:#62b8c7; --sea-route:#6ea6ea; --corr:#b590ea;
  --pipe:#c99a68; --gaspipe:#68bfe6; --cable:#e57dc4; --hist:#d6b26c; --vote:#ad9ff7; --t-space:#a5b4fc; --t-ai:#fdba74; --t-qc:#5eead4; --t-cyber:#fda4af;
  --b-us:#7ba2ee; --b-cn:#ff6253; --b-ru:#b98ade; --b-eu:#4cc7bb; --b-in:#c4c44a;
  --r-ali:#5ccf86; --r-soc:#6ea6ea; --r-ten:#f2a634; --r-riv:#ff6253; --r-gue:#ff9a8a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --sea:#0a1820; --land:#1b2a31; --land-h:#24363e; --border:#3d525b; --grat:#13262f;
  --ink:#e3ebec; --muted:#93a5ab; --panel:#0f1e25; --line:#22353d; --chip:#18292f;
  --accent:#62b8c7; --accent-soft:#1d4a53; --bloc:#2c6470; --sel:#62b8c7;
  --war:#ff6253; --tension:#f2a634; --choke:#62b8c7; --sea-route:#6ea6ea; --corr:#b590ea;
  --pipe:#c99a68; --gaspipe:#68bfe6; --cable:#e57dc4; --hist:#d6b26c; --vote:#ad9ff7; --t-space:#a5b4fc; --t-ai:#fdba74; --t-qc:#5eead4; --t-cyber:#fda4af;
  --b-us:#7ba2ee; --b-cn:#ff6253; --b-ru:#b98ade; --b-eu:#4cc7bb; --b-in:#c4c44a;

  color-scheme:dark}
html,body{height:100%}
body{background:var(--panel);color:var(--ink);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
/* cabecera */
.top{display:flex;align-items:center;gap:12px;padding-block:10px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--f-disp);font-stretch:125%;font-weight:800;font-size:17px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.brand .stamp{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.search{position:relative;margin-left:auto;flex:0 1 300px;min-width:0}
.search input{width:100%;padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:6px;background:var(--chip);color:var(--ink);font-family:var(--f-disp);font-size:14px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:300px;overflow:auto;padding:4px}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:4px;font-family:var(--f-disp);font-size:14px;cursor:pointer}
.results button:hover,.results button.act{background:var(--chip)}
.results small{color:var(--muted);font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase}
/* capas */
.layers{display:flex;gap:14px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);scrollbar-width:thin}
.lg{display:flex;align-items:center;gap:6px;flex:none}
.lg>span{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px 5px 8px;font-family:var(--f-disp);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35;flex:none}
.chip[aria-pressed="true"]{background:var(--chip);color:var(--ink);border-color:var(--border)}
.chip[aria-pressed="true"] i{opacity:1}
/* principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.mapwrap{position:relative;background:var(--sea);overflow:hidden;min-height:0}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.ctry{fill:var(--land);stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.ctry:hover{fill:var(--land-h)}
.ctry.inbloc{fill:var(--bloc)}
.ctry.rel-ali{fill:color-mix(in srgb,var(--r-ali) 35%,var(--land))}
.ctry.rel-soc{fill:color-mix(in srgb,var(--r-soc) 30%,var(--land))}
.ctry.rel-ten{fill:color-mix(in srgb,var(--r-ten) 35%,var(--land))}
.ctry.rel-riv{fill:color-mix(in srgb,var(--r-riv) 35%,var(--land))}
.ctry.rel-gue{fill:color-mix(in srgb,var(--r-gue) 55%,var(--land))}
.ctry.sel{fill:var(--sel);stroke:var(--ink)}
.sphere{fill:var(--sea);stroke:var(--border);stroke-width:.6;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:var(--grat);stroke-width:.6;vector-effect:non-scaling-stroke}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.hit{fill:none;stroke:transparent;cursor:pointer;pointer-events:stroke}
.ln.sea{stroke:var(--sea-route);animation:flow 2.4s linear infinite}
.ln.land{stroke:var(--corr)}
.ln.pipe{stroke:var(--pipe)}
.ln.pipe.gas{stroke:var(--gaspipe)}
.ln.pipe.off{opacity:.55}
.ln.cable{stroke:var(--cable);opacity:.85}
.halo{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round;opacity:0;pointer-events:none;transition:opacity .2s}
.hl-g .halo{opacity:.18}
#map .focus>g:not(.hl-g),#map .focus>g.mk:not(.hl-m){opacity:.22;transition:opacity .2s}
.mk .ring{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;pointer-events:none;transform-origin:0 0}
.mk.hl-m .ring{opacity:.85;animation:ringp 1.6s ease-out infinite}
.mk.hl-m text{display:block;font-size:12.5px}
@keyframes ringp{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.mk.hl-m .ring{animation:none}}
.gitem .item[aria-expanded="true"]{border-color:var(--accent);background:var(--chip);border-bottom-left-radius:0;border-bottom-right-radius:0}
.gdet{border:1px solid var(--accent);border-top:0;border-radius:0 0 6px 6px;padding:2px 10px 10px;margin-top:-6px}
.gdet .facts>div:last-child{border-bottom:0}
.gdesc{font-size:13.5px!important;color:var(--muted);margin:8px 0 0!important}
.hint{font-family:var(--f-disp);font-size:12.5px!important;color:var(--muted);margin:-2px 0 8px!important}
@keyframes flow{to{stroke-dashoffset:-20}}
.arc{fill:none;stroke-linecap:round;pointer-events:none}
.mk{cursor:pointer}
.mk .hitc{fill:transparent}
.mk text{font-family:var(--f-disp);font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;display:none;pointer-events:none}
svg[data-z="2"] .mk.l2 text, svg[data-z="3"] .mk text{display:block}
.mk.on text{display:block}
.pulse{fill:none;stroke:var(--war);stroke-width:1.5;animation:pulse 2s ease-out infinite;transform-origin:0 0}
@keyframes pulse{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.cap-dot{fill:var(--ink);stroke:var(--panel);stroke-width:1.5}
@media (prefers-reduced-motion:reduce){.ln.sea,.pulse{animation:none}.pulse{display:none}}
/* controles del mapa */
.mapui{position:absolute;inset:auto auto 0 0;padding:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:100%}
.mapui>*{pointer-events:auto}
.colorby{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 4px 4px 9px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.colorby label{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.colorby select{border:0;background:var(--chip);color:var(--ink);font-family:var(--f-disp);font-size:13px;padding:4px 6px;border-radius:4px;max-width:160px}
.zoom{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom button{width:34px;height:34px;border:0;background:none;font-family:var(--f-disp);font-size:18px;cursor:pointer}
.zoom button+button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--chip)}
.zoom svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:middle}
.legend{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--f-disp);font-size:12px;max-width:min(300px,calc(100% - 20px));box-shadow:0 2px 8px rgba(0,0,0,.08)}
.legend summary{cursor:pointer;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);list-style:none}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:'▸ ';}
.legend[open] summary::before{content:'▾ ';}
.legend ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.legend li{display:flex;align-items:center;gap:7px}
.legend svg{flex:none}
.legend .bdesc{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-family:var(--f-body);font-size:12px;color:var(--muted);line-height:1.4}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font-family:var(--f-disp);font-size:12px;font-weight:600;padding:4px 8px;border-radius:4px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:5}
.tip small{font-weight:400;opacity:.75;margin-left:6px}
/* panel */
#panel{border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding-block:18px 28px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--panel)}
.eyebrow{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.eyebrow .sw{width:9px;height:9px;border-radius:50%;background:var(--c)}
#panel h2{font-family:var(--f-disp);font-stretch:112%;font-weight:800;font-size:28px;line-height:1.05;margin:0 0 4px;text-wrap:balance}
#panel h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.role{font-family:var(--f-disp);font-size:14px;color:var(--accent);font-weight:600;margin:0 0 10px}
#panel p{font-size:15px;line-height:1.5;margin:0 0 10px}
.lede{color:var(--muted)}
.back{border:0;background:none;padding:0;margin:0 0 14px;font-family:var(--f-disp);font-size:13px;color:var(--accent);cursor:pointer;font-weight:600}
.blocs{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0}
.blocs button{border:1px solid var(--line);background:var(--chip);border-radius:4px;padding:3px 7px;font-family:var(--f-mono);font-size:11px;cursor:pointer}
.blocs button:hover{border-color:var(--accent)}
ul.concerns{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:c}

ul.concerns li::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:1px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font-family:var(--f-mono);font-size:10.5px;display:grid;place-items:center}
.rels{display:grid;gap:2px}
.rel{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.pill{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:3px 6px;border-radius:3px;color:var(--panel);background:var(--c);text-align:center;margin-top:1px}
.rel b{display:block;font-family:var(--f-disp);font-size:14.5px}
.rel .lnk{border:0;background:none;padding:0;font-family:var(--f-disp);font-size:14.5px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.rel .lnk:hover{text-decoration-color:var(--accent)}
.rel span.note{grid-column:2;font-size:13.5px;color:var(--muted);line-height:1.4}
.items{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 10px;cursor:pointer;width:100%}
.item:hover{border-color:var(--accent);background:var(--chip)}
.item .sw{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;margin-top:6px}
.item b{display:block;font-family:var(--f-disp);font-size:14.5px}
.item span{font-size:13.5px;color:var(--muted);line-height:1.4}
.cloud{display:flex;flex-wrap:wrap;gap:5px}
.cloud button{border:1px solid var(--line);background:none;border-radius:4px;padding:4px 8px;font-family:var(--f-disp);font-size:13px;cursor:pointer}
.cloud button:hover{background:var(--chip);border-color:var(--accent)}
.year{font-family:var(--f-mono);font-size:13px;color:var(--hist);margin:0 0 8px}
.reads{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reads a{display:block;color:var(--ink);text-decoration:none;font-family:var(--f-disp);font-size:14px;font-weight:600;line-height:1.3}
.reads a:hover{color:var(--accent);text-decoration:underline}
.reads small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px;font-weight:400}
.agenda{display:grid;gap:4px}
.agenda button{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:baseline;border:0;border-bottom:1px dashed var(--line);background:none;padding:7px 0;text-align:left;cursor:pointer}
.agenda b{font-family:var(--f-mono);font-size:12px;color:var(--vote);font-weight:500}
.agenda span small{display:block;font-family:var(--f-mono);font-size:10.5px;font-weight:400;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.agenda button.past{opacity:.6}
.agenda{grid-template-columns:1fr}
.agenda button{grid-template-columns:72px 1fr}
.vote-line{font-family:var(--f-disp);font-size:13.5px;background:var(--chip);border-left:3px solid var(--vote);padding:6px 9px;border-radius:0 4px 4px 0;margin:8px 0 0!important}
.vote-line b{color:var(--vote)}
.vote-line small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;margin-left:4px}
.agenda span{font-family:var(--f-disp);font-size:14.5px;font-weight:600}
.agenda button:hover span{color:var(--accent)}
details.more summary{cursor:pointer;font-family:var(--f-disp);font-size:13px;color:var(--accent);font-weight:600;margin-top:4px}
ol.temas{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.4}
ol.temas li::marker{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.facts{margin:0;display:grid;gap:0}
.facts>div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:4px 12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.facts dt{font-family:var(--f-disp);font-size:13px;color:var(--muted);line-height:1.35}
.facts dd{margin:0;font-family:var(--f-disp);font-size:14px;font-weight:700;line-height:1.35;font-variant-numeric:tabular-nums}
.facts small{display:block;font-weight:400;font-family:var(--f-mono);font-size:10px;letter-spacing:.03em;color:var(--muted);margin-top:3px}
.facts small a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.facts small a:hover{color:var(--accent)}
.guide-link{display:block;margin-top:14px;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:8px 10px;font-family:var(--f-disp);font-size:13.5px;font-weight:600;color:var(--accent);cursor:pointer;text-align:left;width:100%}
.guide-link:hover{border-color:var(--accent)}
.lgbtn{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
.lgbtn i{font-style:normal;color:var(--accent);margin-left:auto;padding-left:6px}
.lgbtn:hover span{text-decoration:underline}
@media (max-width:480px){.facts>div{grid-template-columns:1fr}}
.actors{display:flex;flex-wrap:wrap;gap:5px}
.actors span{font-family:var(--f-disp);font-size:12.5px;padding:3px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.watch{margin-top:14px;padding:9px 11px;border-left:3px solid var(--tension);background:var(--chip);border-radius:0 6px 6px 0;font-size:14px;line-height:1.45}
.watch b{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tension);margin-bottom:3px;font-weight:500}
.deep{display:grid;gap:10px;counter-reset:dp}
.deep>div{position:relative;padding-left:28px}
.deep>div::before{counter-increment:dp;content:counter(dp);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:4px;background:var(--res-chip);color:var(--panel);font-family:var(--f-mono);font-size:11px;display:grid;place-items:center}
.deep b{font-family:var(--f-disp);font-size:14.5px;display:block;margin-bottom:2px}

 sea:{t:'Rutas marítimas',why:'La globalización flota: casi todo el comercio mundial en volumen viaja en barco porque es, con diferencia, el transporte más barato. Las rutas unen fábricas asiáticas, materias primas de América, África y Oceanía y consumidores europeos y norteamericanos. Su seguridad depende de marinas (sobre todo la de EEUU), de seguros y de un puñado de estrechos. Un desvío no corta el comercio, pero lo encarece y lo alarga, con efecto directo sobre la inflación.',d:[['Comercio marítimo mundial 2024','12.720 millones de toneladas (+2,2 %)','unc'],['Tránsitos por Suez (mayo 2025)','~70 % por debajo de la media de 2023','unc'],['Canal de Panamá, año fiscal 2025','13.404 tránsitos · 489 millones de toneladas (+15,6 %)','acp']]},
 land:{t:'Corredores terrestres',why:'Son la respuesta continental al dominio naval: ferrocarriles y carreteras que conectan Asia y Europa sin depender de estrechos que podría bloquear una marina rival. Construirlos da influencia política sobre los países de tránsito. Por eso compiten la Ruta de la Seda china, los corredores que esquivan a Rusia tras 2022 (Corredor Medio) y las alternativas occidentales (IMEC, Lobito). Mueven mucha menos carga que el mar, pero son más rápidos y estratégicos.',d:[['Trenes China–Europa en 2025','20.022 viajes · 236 ciudades de 26 países europeos','cer'],['Corredor Medio, 1S 2025','2,3 millones de toneladas (+7 %)','mc']]},
 pipe:{t:'Oleoductos y gasoductos',why:'Un ducto ata a productor y consumidor durante décadas: no se puede redirigir como un barco. Esa interdependencia fue durante años sinónimo de estabilidad entre Rusia y Europa, y se convirtió en arma en 2022. Hoy los ductos importan por dos razones: diversificar proveedores (Noruega, Argelia, Azerbaiyán) y esquivar estrechos peligrosos (oleoductos saudí y emiratí que evitan Ormuz).',d:[['Gas ruso por tubo a Europa 2025','~18 bcm, mínimo desde los años 70 (175-180 bcm en 2018-19)','rtg'],['Noruega en la UE (2025)','54 % del gas importado por tubo (86 bcm)','ce'],['Fin del gas ruso en la UE','GNL a final de 2026; gas por tubo en sept. 2027','ce'],['Capacidad para esquivar Ormuz','~2,6 millones de barriles/día disponibles por oleoductos saudí y emiratí','eiah']]},
 cable:{t:'Cables submarinos',why:'Internet es físico: casi todo el tráfico de datos entre continentes viaja por fibra bajo el mar. Por estos cables pasan las finanzas, la nube y las comunicaciones militares. Son baratos de dañar y difíciles de vigilar: un ancla arrastrada basta. Los cortes en el Báltico, el mar Rojo y alrededor de Taiwán muestran que son un objetivo de guerra híbrida. Además, su propiedad está pasando a las grandes tecnológicas estadounidenses.',d:[['Sistemas en servicio (2026)','603, y 91 más planificados o en obras','tg'],['Tráfico intercontinental por cable','Más del 99 %','tg'],['Ancho de banda internacional de las grandes tecnológicas','~75 %','tg'],['Islas Matsu (Taiwán)','Aisladas más de 20 veces en 5 años por cortes de cable','tg']]},
 'r:oil':{t:'Petróleo',why:'Sigue moviendo el transporte, la petroquímica y los ejércitos. Su precio contagia la inflación y puede tumbar gobiernos. El poder petrolero se reparte entre el esquisto estadounidense, la OPEP+ liderada por Arabia Saudí y Rusia, y productores sancionados (Irán, Venezuela) que venden con descuento a China e India. La guerra de Irán de 2026 ha vuelto a poner el crudo en el centro.',d:[['Estados Unidos (2025)','13,6 millones de barriles/día, récord y primer productor','eiap'],['Arabia Saudí (2025)','9,6 millones de barriles/día','eiap'],['Rusia (2024)','9,9 millones de barriles/día','eiap']]},
 'r:gas':{t:'Gas natural y GNL',why:'Calienta casas, alimenta la industria y produce electricidad. El gas licuado (GNL) lo ha convertido en un mercado global que se mueve en barco. Europa sustituyó el gas ruso por gas noruego y estadounidense, lo que da a Washington una nueva palanca. Catar e Irán comparten el mayor yacimiento del mundo, junto al estrecho de Ormuz.',d:[['GNL en las importaciones de la UE (2025)','45 % (131 bcm)','ce'],['EEUU en el GNL de la UE','58 % (76 bcm)','ce'],['GNL mundial que pasaba por Ormuz (2024)','~1/5, sobre todo de Catar','eiah']]},
 'r:rare':{t:'Tierras raras',why:'Son 17 elementos imprescindibles para los imanes de motores eléctricos, aerogeneradores, móviles y misiles. China domina la extracción y aún más el refinado, y desde 2025 usa controles a la exportación como arma comercial. Romper esa dependencia es una prioridad de EEUU, la UE, Japón e India, de ahí el interés por Groenlandia, Australia o Myanmar.',d:[['Producción mundial (2025)','~390.000 t · China 270.000 t (≈69 %)','usre'],['Otros productores (2025)','EEUU 51.000 t · Australia 29.000 · Myanmar 22.000','usre'],['Controles chinos','Abril 2025: 7 elementos; ampliados en octubre y suspendidos un año en noviembre','usre'],['Refinado de minerales críticos','China lidera 19 de 20 minerales, con ~70 % de cuota media','iea']]},
 'r:lith':{t:'Litio',why:'Es el corazón de las baterías de coches eléctricos y del almacenamiento de energía. Está en salares andinos (Chile, Argentina, Bolivia) y en roca (Australia), pero China controla buena parte del refinado y ya es el segundo productor minero. Es un recurso de la transición energética, en disputa entre inversión china y occidental.',d:[['Producción 2025','Australia 92.000 t · China 62.000 · Chile 56.000 · Zimbabue 28.000 · Argentina 23.000','usli'],['Bolivia','23 millones de t en recursos, aún sin apenas producción','usli'],['Demanda de litio en 2024','+~30 %','iea']]},
 'r:metal':{t:'Cobre, cobalto y níquel',why:'Son los metales de la electrificación: redes eléctricas, baterías, centros de datos. Su producción está muy concentrada (cobalto en la RDC, níquel en Indonesia) y los Estados productores la usan como palanca, con prohibiciones o cuotas de exportación. La IEA prevé escasez de cobre en la próxima década.',d:[['Cobre (2025)','~23 Mt mundiales · Chile 5,3 Mt (casi 1/4)','uscu'],['Cobalto (2025)','RDC 230.000 de 310.000 t (≈73 %) · Indonesia ≈14 %','usco'],['Níquel (2025)','Indonesia ~2,6 de 3,9 Mt (≈2/3)','usni'],['Política de la RDC','Prohibió exportar cobalto en feb. 2025; desde oct., cuotas','usco'],['Cobre en 2035','Déficit de oferta previsto del 30 %','iea']]},
 'r:ura':{t:'Uranio',why:'Combustible de la energía nuclear, que vive un renacimiento por la seguridad energética, el clima y la demanda eléctrica de la IA. La producción está concentrada en Kazajistán, Canadá y Namibia. El Sahel muestra su dimensión geopolítica: Níger nacionalizó el uranio que explotaba Francia.',d:[['Producción mundial (2024)','60.213 t de uranio','wna'],['Principales productores','Kazajistán 39 % · Canadá 24 % · Namibia 12 %','wna'],['Mayores minas','Cigar Lake (Canadá) 11 % · Husab (Namibia) 7 %','wna']]},
 'r:chip':{t:'Semiconductores',why:'Sin chips no hay IA, ni armas modernas, ni coches, ni teléfonos. La fabricación avanzada se concentra en Taiwán, la maquinaria crítica en Países Bajos (ASML) y el diseño en EEUU. Esa concentración convierte a Taiwán en el punto más sensible del planeta y explica la guerra de controles a la exportación entre Washington y Pekín.',d:[['Cuota de fundición mundial, 2T 2025','TSMC 70,2 % (récord) · Samsung 7,3 %','tf']]},
 'r:grain':{t:'Grano',why:'El trigo, el maíz y la soja son seguridad alimentaria y estabilidad política: el precio del pan ha derribado gobiernos en Oriente Medio y África. Rusia usa sus exportaciones como herramienta diplomática, la guerra en Ucrania afectó al “granero de Europa” y China depende de la soja de Brasil y EEUU.',d:[['Cuota de exportación mundial de trigo','EEUU 19,8 % · Rusia 18,1 % · UE 14,2 %','wht'],['Rusia, campaña 2024/25','52,4 Mt exportadas, primer exportador mundial','wht']]},
 'r:water':{t:'Agua',why:'Más de la mitad de los grandes ríos cruzan fronteras. Quien controla la cabecera (con presas) controla al vecino de abajo: Etiopía frente a Egipto, China frente a India y el Sudeste Asiático, Turquía frente a Irak y Siria, India frente a Pakistán. El cambio climático agrava la escasez.',d:[['Presa GERD (Etiopía)','5.150 MW, inaugurada en septiembre de 2025','gerd'],['Central de Medog (China)','60 GW previstos; obras desde el 19 jul. 2025; >1 billón de yuanes','med']]},
 'r:phos':{t:'Fosfatos',why:'Sin fósforo no hay fertilizantes, y sin fertilizantes no hay agricultura intensiva. Marruecos posee la mayor parte de las reservas mundiales, lo que da peso global a Rabat y añade una dimensión económica a la disputa del Sáhara Occidental.',d:[['Reservas mundiales','~73.000 Mt · Marruecos 50.000 Mt (≈68 %)','usph'],['Producción 2025','~250 Mt · China 110 · Marruecos 36','usph']]}
};
/* Detalle por elemento: why = importancia; d = datos [etiqueta, valor, fuente] */
const DET={
 'Estrecho de Ormuz':{why:'Es la única salida al mar de Kuwait, Irak, Catar, Baréin e Irán, y la principal de Arabia Saudí y EAU. Casi todo lo que pasa va a Asia. Su cierre en 2026 es el mayor shock energético desde los años 70.',d:[['Petróleo (1S 2025)','20,9 mb/d','eia'],['Destino del crudo y del GNL (2024)','84 % y 83 % hacia Asia','eiah'],['Alternativas por tubo','~2,6 mb/d disponibles','eiah']]},
 'Estrecho de Malaca':{why:'Es la arteria entre el Índico y el Pacífico. Por ella pasa la mayoría del crudo que importan China, Japón y Corea, y por eso Pekín teme un bloqueo estadounidense y busca alternativas (Myanmar, Pakistán).',d:[['Petróleo (1S 2025)','23,2 mb/d, el mayor del mundo','eia']]},
 'Canal de Suez':{why:'Es el atajo Europa-Asia y una fuente vital de divisas para Egipto. Los ataques hutíes en el mar Rojo lo vaciaron parcialmente y empujaron el tráfico hacia el Cabo.',d:[['Tránsitos (mayo 2025)','~70 % por debajo de 2023','unc'],['Petróleo Suez + SUMED','4,9 mb/d (1S 2025), la mitad que en 2023','eia']]},
 'Bab el-Mandeb':{why:'Es la entrada sur del mar Rojo, flanqueada por Yemen y Yibuti. Los hutíes demostraron que un actor no estatal puede alterar el comercio mundial con drones y misiles baratos.',d:[['Petróleo (1S 2025)','4,2 mb/d, la mitad que en 2023','eia'],['GNL','Cero en 2024 y 1S 2025','eia']]},
 'Canal de Panamá':{why:'Une el Atlántico y el Pacífico y es clave para las exportaciones de EEUU a Asia. La sequía de 2023-24 expuso su dependencia del agua dulce, y Washington presiona contra la influencia china en sus puertos.',d:[['Año fiscal 2025','13.404 tránsitos (+19 %) · 489 Mt','acp'],['Petróleo','2,3 mb/d (año fiscal 2025)','eia']]},
 'Bósforo y Dardanelos':{why:'Son la única salida de Rusia, Ucrania y el mar Caspio (vía oleoductos) al Mediterráneo. Turquía puede cerrarlos a buques de guerra en tiempo de conflicto, como hizo en 2022.',d:[['Petróleo por los Dardanelos','3,7 mb/d (1S 2025), 60 % crudo','eia']]},
 'Estrechos daneses':{why:'Son la salida del Báltico y la vía de la “flota sombra” que exporta crudo ruso esquivando sanciones.',d:[['Petróleo (1S 2025)','4,9 mb/d','eia'],['GNL (1S 2025)','1,6 Bcf/d','eia']]},
 'Cabo de Buena Esperanza':{why:'No es un estrecho, sino la gran alternativa a Suez: más larga y cara, pero fuera del alcance de los hutíes.',d:[['Petróleo (1S 2025)','9,1 mb/d, +3 mb/d desde 2022','eia']]},
 'Estrecho de Taiwán':{why:'Un bloqueo afectaría a una de las rutas más transitadas del mundo y a la fábrica de chips del planeta.',d:[['Cuota de TSMC en fundición','70,2 % (2T 2025)','tf']]},
 'Estrecho de Gibraltar':{why:'Controla la entrada y salida del Mediterráneo. Por eso España, Reino Unido, Marruecos y EEUU tienen bases a su alrededor.',d:[]},
 'Paso de Calais':{why:'Es la ruta de acceso a los grandes puertos del norte de Europa (Róterdam, Amberes, Hamburgo).',d:[]},
 'Estrecho de Bering':{why:'El deshielo lo convierte en puerta de la Ruta Marítima del Norte y en frontera directa entre Rusia y EEUU.',d:[]},
 'Brecha GIUK':{why:'Es la clave antisubmarina de la OTAN desde la Guerra Fría: la Flota rusa del Norte debe cruzarla para llegar al Atlántico.',d:[]},
 'Estrecho de Lombok':{why:'Su profundidad permite el paso de superpetroleros y submarinos que no caben en Malaca.',d:[]},
 'Estrecho de Kerch':{why:'Su control permitió a Rusia convertir el mar de Azov en un lago propio y abastecer Crimea.',d:[]},
 'Asia–Europa por Suez':{why:'Es la ruta comercial más importante del mundo: lleva manufacturas asiáticas a Europa y energía del Golfo hacia el oeste. Cruza cuatro estrechos críticos, y cualquiera de ellos puede encarecerla.',d:[['Tránsitos por Suez (mayo 2025)','~70 % por debajo de 2023','unc']]},
 'Desvío por el Cabo':{why:'Es la válvula de escape cuando el mar Rojo es inseguro. Añade unos 10-14 días de viaje y aumenta la demanda de barcos y combustible, lo que encarece los fletes.',d:[['Petróleo por el Cabo (1S 2025)','9,1 mb/d','eia']]},
 'Golfo Pérsico–Asia':{why:'Abastece de energía a China, India, Japón y Corea. Su interrupción en 2026 golpea sobre todo a Asia.',d:[['Crudo de Ormuz que va a Asia','84 % (2024)','eiah']]},
 'Transpacífico':{why:'Une las dos mayores economías. Los aranceles cruzados desde 2025 han reducido y reorientado parte de este tráfico hacia México y el Sudeste Asiático.',d:[]},
 'Transatlántica':{why:'Es el eje económico de Occidente. Desde 2022 lleva también GNL estadounidense que sustituye al gas ruso.',d:[['EEUU en el GNL de la UE (2025)','58 %','ce']]},
 'Atlántico–Pacífico por Panamá':{why:'Ahorra unos 13.000 km frente a rodear el cabo de Hornos. Es vital para la costa este de EEUU.',d:[['Año fiscal 2025','489 Mt','acp']]},
 'Panamá–Asia':{why:'Lleva granos, GLP y GNL estadounidenses a Asia, y es sensible a las sequías del canal.',d:[]},
 'Ruta Marítima del Norte':{why:'Rusia la controla y la promueve como alternativa a Suez gracias al deshielo. China la explora como “Ruta de la Seda Polar”. Sigue limitada por el hielo y los rompehielos.',d:[]},
 'Brasil–China (soja y hierro)':{why:'Es símbolo del eje Sur-Sur: Brasil alimenta a China y le vende hierro. Hace a China menos dependiente de EEUU en alimentos.',d:[]},
 'Australia–Asia (mineral)':{why:'Australia sostiene la industria siderúrgica china aunque sea aliada militar de EEUU (AUKUS). Esa interdependencia limita a ambos.',d:[]},
 'Tren China–Europa (Nueva Ruta de la Seda)':{why:'Es la columna vertebral terrestre de la Ruta de la Seda. Es más rápido que el barco, pero cruza Rusia y Bielorrusia, lo que lo expone a las sanciones.',d:[['Viajes en 2025','20.022 (10,8 veces más que en 2016)','cer']]},
 'Corredor Medio (Transcaspio)':{why:'Es la apuesta de Kazajistán, Azerbaiyán, Georgia, Turquía y la UE para conectar con China sin pasar por Rusia. Sus cuellos de botella son los puertos del Caspio.',d:[['Carga 1S 2025','2,3 Mt (+7 %)','mc']]},
 'Corredor Norte-Sur (INSTC)':{why:'Une Rusia, Irán e India y esquiva Suez y las rutas controladas por Occidente. La guerra de Irán lo ha dejado en suspenso.',d:[]},
 'Corredor IMEC':{why:'Fue anunciado en el G20 de 2023 por EEUU, la UE, India, Arabia Saudí y EAU como alternativa a la Ruta de la Seda. Depende de la normalización entre Israel y el Golfo, congelada por Gaza.',d:[]},
 'Corredor CPEC':{why:'Es el proyecto estrella de la Ruta de la Seda en Pakistán: da a China salida al Índico en Gwadar y esquiva Malaca. Las insurgencias en Baluchistán lo atacan.',d:[]},
 'Corredor de Lobito':{why:'Es la respuesta de EEUU y la UE a China en África: saca cobre y cobalto de la RDC y Zambia por Angola hacia el Atlántico.',d:[['Cobalto de la RDC','≈73 % del mundial (2025)','usco']]},
 'Corredor TRIPP (Zangezur)':{why:'Pactado en Washington en agosto de 2025, une Azerbaiyán con su exclave de Najicheván por Armenia, con gestión estadounidense. Reduce la influencia rusa e iraní en el Cáucaso.',d:[]},
 'Druzhba (norte)':{why:'Fue el mayor oleoducto del mundo y símbolo de la dependencia europea del crudo ruso. Su tramo norte casi no opera desde las sanciones.',d:[]},
 'Druzhba (sur)':{why:'Mantiene a Hungría y Eslovaquia ligadas al crudo ruso, lo que explica sus posiciones en la UE. Ucrania lo ha atacado.',d:[]},
 'Nord Stream (dañado)':{why:'Era la gran apuesta energética germano-rusa. Su sabotaje en 2022 simboliza el fin de esa era.',d:[['Capacidad de Nord Stream 1','55 bcm/año','op'],['Gas ruso por tubo a Europa (2025)','~18 bcm','rtg']]},
 'TurkStream':{why:'Desde que Ucrania dejó de transitar gas ruso (1 de enero de 2025), es la única ruta de gas ruso por tubo a la UE (Hungría, Serbia, Eslovaquia). Da a Turquía un papel de hub energético.',d:[['Capacidad','31,5 bcm/año (dos líneas)','op'],['Flujos a Europa 2025','+7 % sobre 16,8 bcm de 2024','rtg']]},
 'Fuerza de Siberia':{why:'Es el giro de Rusia hacia China: el gas que ya no compra Europa se intenta vender a Pekín, en condiciones que fija el comprador.',d:[['Capacidad','38 bcm/año','op']]},
 'Fuerza de Siberia 2 (proyecto)':{why:'Su pacto en 2025 confirma la dependencia rusa de China. Tardaría años en construirse.',d:[['Capacidad prevista','50 bcm/año','op']]},
 'BTC':{why:'Llevó por primera vez petróleo del Caspio a Occidente sin pasar por Rusia ni Irán. Es la base de la alianza Turquía-Azerbaiyán.',d:[['Capacidad','~1,2 mb/d','op']]},
 'Corredor Sur de Gas (TANAP-TAP)':{why:'Es la principal vía de gas no ruso desde el este hacia la UE.',d:[['Azerbaiyán en el gas por tubo de la UE (2025)','11 bcm (7 %)','ce']]},
 'Petroline (Este-Oeste)':{why:'Permite a Arabia Saudí exportar por el mar Rojo sin cruzar Ormuz. Por eso Irán lo atacó en 2026.',d:[['Capacidad','5 mb/d (7 mb/d temporalmente en 2019)','eiah']]},
 'Habshan–Fuyaira':{why:'Es la salvaguarda de EAU frente al cierre de Ormuz.',d:[['Capacidad','1,8 mb/d','eiah']]},
 'Kirkuk–Ceyhan':{why:'Saca crudo iraquí y kurdo al Mediterráneo, y es un factor de tensión entre Bagdad, Erbil y Ankara.',d:[['Estado','Reanudado en septiembre de 2025','eia']]},
 'Medgaz':{why:'Une directamente Argelia y España. Es la principal ruta de gas argelino a España desde el cierre del gasoducto que cruzaba Marruecos.',d:[['Capacidad','10,5 bcm/año','op'],['Norte de África en el gas por tubo de la UE (2025)','29 bcm (19 %)','ce']]},
 'Transmed':{why:'Lleva gas argelino a Italia y convierte a Argelia en socio clave de Roma.',d:[]},
 'Magreb-Europa (cerrado)':{why:'Argelia lo cerró en 2021 para no pasar gas por Marruecos. Es el ejemplo de cómo un conflicto (el Sáhara) corta una infraestructura.',d:[]},
 'Keystone':{why:'Lleva crudo canadiense a EEUU: la interdependencia energética norteamericana que ahora tensan los aranceles.',d:[]},
 'ESPO':{why:'Lleva crudo siberiano al Pacífico y a China. Es clave para que Rusia esquive el embargo europeo.',d:[]},
 'Myanmar–China':{why:'Da a China energía desde el Índico esquivando Malaca. Por eso Pekín protege a la junta.',d:[]},
 'Asia Central–China':{why:'Hace de China el principal comprador del gas turcomano y desplaza la influencia rusa en Asia Central.',d:[]},
 'SEA-ME-WE 6':{why:'Es la espina dorsal de datos entre Asia y Europa. Pasa por el mar Rojo, donde se cortaron cables en febrero de 2024 y septiembre de 2025.',d:[['Cortes en el mar Rojo','Febrero 2024 y septiembre 2025','tg']]},
 '2Africa':{why:'Es el cable más largo del mundo, liderado por Meta, y conecta África de forma masiva. Muestra el papel de las grandes tecnológicas como actores geopolíticos.',d:[['Longitud','~45.000 km','tg']]},
 'MAREA (transatlántico)':{why:'Microsoft y Meta lo tendieron hasta Bilbao, lo que convierte a España en puerta digital de Europa.',d:[]},
 'Grace Hopper':{why:'Es un cable de Google entre EEUU y Europa: muestra el control privado de la infraestructura.',d:[]},
 'Transpacífico (JUPITER)':{why:'Une Japón y EEUU, aliados tecnológicos frente a China.',d:[]},
 'EllaLink':{why:'Conecta Brasil y Europa sin pasar por EEUU, en una apuesta por la soberanía digital tras las revelaciones de espionaje.',d:[]},
 'C-Lion1 (Báltico)':{why:'Fue dañado en noviembre de 2024 junto a otro cable. Es símbolo de la guerra híbrida en el Báltico.',d:[]},
 'Cables del estrecho de Taiwán':{why:'Sus cortes son ensayos de un aislamiento digital de Taiwán.',d:[['Islas Matsu','Más de 20 cortes en 5 años','tg']]},
 'Ghawar':{why:'Sostiene la capacidad saudí de subir o bajar producción y, con ello, de influir en el precio mundial.',d:[['Arabia Saudí (2025)','9,6 mb/d','eiap']]},
 'Cuenca Pérmica':{why:'El esquisto convirtió a EEUU en primer productor y exportador de energía, lo que cambia su política en Oriente Medio.',d:[['EEUU (2025)','13,6 mb/d, récord','eiap']]},
 'Bayan Obo':{why:'Es la base del dominio chino de las tierras raras.',d:[['China (2025)','270.000 t (≈69 % mundial)','usre']]},
 'Mountain Pass':{why:'Es la apuesta de EEUU para reconstruir una cadena propia de tierras raras.',d:[['EEUU (2025)','51.000 t','usre']]},
 'Mount Weld':{why:'Lynas es el gran productor occidental fuera de China.',d:[['Australia (2025)','29.000 t','usre']]},
 'Kachin':{why:'Las minas del norte de Myanmar abastecen a China de tierras raras pesadas, y EEUU busca acceso a ellas.',d:[['Myanmar (2025)','22.000 t','usre']]},
 'Salar de Atacama':{why:'Chile combina litio y cobre, y estatiza parcialmente el litio con su estrategia nacional.',d:[['Chile, litio (2025)','56.000 t','usli']]},
 'Salar de Uyuni':{why:'Tiene enormes recursos casi sin explotar, disputados por empresas chinas y rusas.',d:[['Bolivia','23 Mt en recursos','usli']]},
 'Greenbushes':{why:'Australia es el primer productor mundial de litio, pero procesa en China.',d:[['Australia (2025)','92.000 t','usli']]},
 'Jiangxi':{why:'China ya es el segundo productor minero de litio y lidera el refinado.',d:[['China (2025)','62.000 t','usli']]},
 'Katanga':{why:'Concentra el cobalto mundial, explotado sobre todo por empresas chinas. Está ligado al conflicto del este de la RDC.',d:[['RDC (2025)','230.000 t (≈73 %)','usco']]},
 'Escondida':{why:'Chile domina el cobre, el metal de la electrificación.',d:[['Chile (2025)','5,3 Mt (casi 1/4 mundial)','uscu']]},

  d:[['Lanzamientos orbitales en 2025','324, récord, impulsado por SpaceX y China','laun'],['Artemis II (EEUU)','Primer vuelo tripulado a la Luna desde 1972: 1 de abril de 2026','art2'],['China','Alunizaje tripulado previsto hacia 2030; pruebas del Long March 10, Mengzhou y Lanyue','cnmoon'],['Golden Dome','~1,2 billones de $ en 20 años según la Oficina Presupuestaria del Congreso (la Casa Blanca habla de 175.000 M$)','gdome']]},
 ai:{t:'IA y centros de datos',why:'La IA es la gran apuesta tecnológica y económica de esta década. Su base es física: centros de datos que consumen enormes cantidades de electricidad y agua, chips avanzados (Nvidia, TSMC, ASML) y minerales (galio, tierras raras). EEUU limita la venta de chips a China y China responde con chips propios y planificación estatal. Los países del Golfo usan su energía barata y su capital para convertirse en potencias de IA.',
  d:[['Electricidad de los centros de datos (2024)','~415 TWh, ~1,5 % del consumo mundial','iaai'],['Previsión 2030','~945 TWh, más del doble','iaai'],['Reparto (2024)','EEUU 45 % · China 25 % · Europa 15 %','iaai'],['En EEUU','Casi la mitad del crecimiento de la demanda eléctrica hasta 2030','iaai'],['Galio refinado en China','~99 %','iaai'],['Stargate (EEUU)','500.000 M$ · 0,3 GW operativos en Abilene · más de 9 GW planificados','epoch'],['Chips H200 vendidos a China','Cero, pese a la autorización de Trump (feb. 2026)','h200']]},
 qc:{t:'Computación cuántica',why:'Un ordenador cuántico suficientemente potente podría romper el cifrado que protege bancos, gobiernos y ejércitos. Eso convierte la cuántica en una carrera de seguridad nacional, aunque aún falta mucho para máquinas útiles: el gran obstáculo es corregir los errores. Los Estados ya migran a “criptografía poscuántica” porque los datos robados hoy podrían descifrarse mañana.',
  d:[['Zuchongzhi 3.0 (China)','105 cúbits superconductores','zcz'],['Estándares poscuánticos de EEUU','FIPS 203, 204 y 205, publicados en agosto de 2024','pqc'],['Amenaza principal','“Recolectar ahora, descifrar después”','pqc'],['Plan quinquenal chino','La tecnología cuántica es prioridad del XV Plan','fyp']]},
 cyber:{t:'Ciberseguridad',why:'El ciberespacio es el campo de batalla permanente: espionaje, sabotaje y extorsión ocurren cada día sin declaración de guerra. Las infraestructuras críticas (energía, agua, telecomunicaciones, cables submarinos) son el objetivo, y la IA hace los ataques más sofisticados. China, Rusia, Irán y Corea del Norte son los actores estatales más citados; EEUU e Israel también han usado ciberarmas, como Stuxnet.',
  d:[['Ciberataques contra empresas energéticas','Se han triplicado en cuatro años','iaai'],['Volt Typhoon','Más de 100 intrusiones; preparación para una guerra por Taiwán','typh'],['Salt Typhoon','Metadatos de llamadas de más de un millón de usuarios en EEUU','typh']]}
});

LENSES.tec={t:'Carreras tecnológicas',sub:'Espacio, IA, cuántica y ciberseguridad',
 thesis:['La rivalidad entre EEUU y China se libra también en cuatro carreras tecnológicas: el espacio, la inteligencia artificial, la computación cuántica y la ciberseguridad. Quien lidere estas tecnologías tendrá ventaja económica, militar y de inteligencia en las próximas décadas.','Aunque parezcan inmateriales, son muy físicas. La IA depende de electricidad, agua, chips de Taiwán, máquinas de ASML y galio chino. La carrera espacial, de puertos y cohetes. La ciberseguridad protege la energía y los cables submarinos. Por eso enlazan con casi todas las capas del atlas: recursos, cuellos de botella, cables, Taiwán y la perspectiva de los límites físicos.'],
 d:[['Centros de datos: electricidad 2024 → 2030','~415 → ~945 TWh','iaai'],['Galio refinado en China','~99 %','iaai'],['Lanzamientos orbitales (2025)','324, récord','laun'],['Ciberataques contra empresas energéticas','×3 en cuatro años','iaai']],
 contra:'No todo es carrera lineal. El CIDOB y Foreign Affairs advierten del riesgo de una burbuja de inversión en IA. Las afirmaciones de “ventaja cuántica” se discuten porque los algoritmos clásicos mejoran. La atribución de ciberataques es difícil y se politiza. Desde la mirada de Turiel, el consumo eléctrico de la IA choca con los límites energéticos; desde la de Andreessen o los ecomodernistas, la IA ayudará a resolverlos.',
 fit:'En el atlas, activa las capas de Tecnología junto a Semiconductores, Cables submarinos y Cuellos de botella. Mira la ficha de ASML, la de Taiwán y el Mapa de la incertidumbre.',
 items:[['pt','Stargate Abilene'],['pt','Datos del Este, Cómputo del Oeste'],['pt','Stargate UAE'],['pt','Hefei (USTC)'],['pt','Wenchang'],['pt','Volt Typhoon (Guam)'],['pt','Veldhoven (ASML)'],['pt','Hsinchu (TSMC)']],

const EL=ELECTIONS.map(e=>({iso:e[0],id:e[1],title:e[2],note:e[3],approx:!!e[4],date:new Date(e[0]+'T00:00:00')})).sort((a,b)=>a.date-b.date);
const fdate=(e,y)=>e.approx?`${MES[e.date.getMonth()]} ${e.date.getFullYear()}`:`${e.date.getDate()} ${MES[e.date.getMonth()]}${y?' '+e.date.getFullYear():''}`;
const estatus=e=>{const d=Math.round((e.date-TODAY)/864e5);return d<0?'Celebrada':d===0?'Hoy':d===1?'Mañana':e.approx?'Fecha por confirmar':`Dentro de ${d} días`};
const elFor=id=>EL.filter(e=>e.id===id);
EL.forEach(e=>{const f=byId.get(e.id);const ll=C[e.id]?.cap||(f?d3.geoCentroid(f):null);if(ll)PT.push({layer:'vote',name:e.title,ll,desc:e.note,el:e,lvl:2})});
const OWN={us:['EEUU','var(--b-us)'],cn:['China','var(--b-cn)'],ru:['Rusia','var(--b-ru)'],eu:['R. Unido / Francia','var(--b-eu)'],in:['India / Turquía','var(--b-in)']};
function ptColor(d){if(d.layer==='vote')return'var(--vote)';if(TECH[d.layer])return`var(--t-${d.layer})`;return d.layer==='war'?'var(--war)':d.layer==='tension'?'var(--tension)':d.layer==='choke'?'var(--choke)':d.layer==='base'?OWN[d.own][1]:d.layer==='hist'?'var(--hist)':`var(--res-${d.rt})`}
function ptLabel(d){if(d.layer==='vote')return'Cita electoral · '+fdate(d.el,1);if(TECH[d.layer])return'Tecnología · '+TECH[d.layer];return d.layer==='war'?'Conflicto armado':d.layer==='tension'?'Tensión latente':d.layer==='choke'?'Cuello de botella':d.layer==='base'?'Base militar · '+OWN[d.own][0]:d.layer==='hist'?'Hito histórico':'Recurso · '+RES_TYPES[d.rt][0]}
const mk=gMk.selectAll('g').data(PT).join('g').attr('class',d=>`mk l${d.lvl}`)
 .on('click',(e,d)=>{e.stopPropagation();showPoint(d,true)})

mk.append('circle').attr('class','hitc').attr('r',12);
mk.append('circle').attr('class','ring').attr('r',11);
mk.each(function(d){const g=d3.select(this),c=ptColor(d);
 if(d.layer==='war'){if(d.int==='alta')g.append('circle').attr('class','pulse').attr('r',7);g.append('circle').attr('r',d.int==='alta'?6:d.int==='media'?5:4).attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.5)}
 else if(d.layer==='tension')g.append('path').attr('d','M0,-6.5L6,4L-6,4Z').attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.5);

 else if(d.layer==='base')g.append('rect').attr('x',-4).attr('y',-4).attr('width',8).attr('height',8).attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.5);
 else if(d.layer==='vote'){const past=d.el.date<TODAY;g.append('rect').attr('x',-5.5).attr('y',-5.5).attr('width',11).attr('height',11).attr('rx',2.5).attr('fill',past?'var(--panel)':'var(--vote)').attr('stroke',past?'var(--vote)':'var(--panel)').attr('stroke-width',1.6);g.append('path').attr('d','M-2.5,-1.5H2.5').attr('stroke',past?'var(--vote)':'var(--panel)').attr('stroke-width',1.6).attr('stroke-linecap','round')}
 else if(d.layer==='space')g.append('path').attr('d','M0,-7L1.9,-2.4L6.7,-2.2L2.9,0.9L4.2,5.6L0,2.9L-4.2,5.6L-2.9,0.9L-6.7,-2.2L-1.9,-2.4Z').attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.2);
 else if(d.layer==='ai')g.append('path').attr('d','M0,-6L5.2,-3L5.2,3L0,6L-5.2,3L-5.2,-3Z').attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.4);
 else if(d.layer==='qc'){g.append('circle').attr('r',5.5).attr('fill','var(--panel)').attr('stroke',c).attr('stroke-width',2);g.append('circle').attr('r',2.2).attr('fill',c)}
 else if(d.layer==='cyber')g.append('path').attr('d','M1.5,-7L-4.5,1L-0.5,1L-1.5,7L4.5,-1L0.5,-1Z').attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.2);
 else if(d.layer==='hist')g.append('circle').attr('r',4.5).attr('fill','var(--panel)').attr('stroke',c).attr('stroke-width',2.2);
 else g.append('circle').attr('r',4.5).attr('fill',c).attr('stroke','var(--panel)').attr('stroke-width',1.3);
 g.append('text').attr('x',9).attr('y',4).text(d.layer==='hist'?`${d.name} · ${d.year}`:d.layer==='vote'?`${fdate(d.el)} · ${d.name.split(' · ')[0]}`:d.name);
});

/* render / reproyección */
function render(){
 const r=wrap.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(220,r.height);
 svg.attr('viewBox',`0 0 ${W} ${H}`);
 proj=d3.geoNaturalEarth1().rotate([-10,0]).fitExtent([[8,8],[W-8,H-8]],{type:'Sphere'});
 path=d3.geoPath(proj);
 gSphere.attr('d',path({type:'Sphere'}));
 gGrat.attr('d',path(d3.geoGraticule10()));
 countryPaths.attr('d',path);
 lineG.selectAll('path').attr('d',d=>path({type:'LineString',coordinates:d.coords}));
 PT.forEach(d=>{d.xy=proj(d.ll)});
 zoom.extent([[0,0],[W,H]]).translateExtent([[0,0],[W,H]]);
 drawArcs();onZoom(curT);
}
function onZoom(t){
 curT=t;K=t.k;root.attr('transform',t);
 svg.attr('data-z',K>=4.5?3:K>=2.2?2:1);
 mk.attr('transform',d=>`translate(${d.xy[0]},${d.xy[1]}) scale(${(d===HL?1.55:1)/K})`);
 const s=w=>w/K,BW={sea:1.7,land:3,pipe:2.2,cable:1.3},m=d=>d===HL?2.3:1;
 gLines.selectAll('.ln').attr('stroke-width',d=>s(BW[d.layer]*m(d)));
 gLines.selectAll('.halo').attr('stroke-width',d=>s(BW[d.layer]*2.3+9));
 gLines.selectAll('.ln.sea').attr('stroke-dasharray',`${s(6)} ${s(4)}`);
 gLines.selectAll('.ln.land').attr('stroke-dasharray',d=>`${s(.5)} ${s(5*m(d))}`);
 gLines.selectAll('.ln.pipe').attr('stroke-dasharray',d=>d.sub==='off'?`${s(3)} ${s(3)}`:d.sub==='plan'?`${s(8)} ${s(4)}`:null);
 gLines.selectAll('.hit').attr('stroke-width',s(14));
 gArcs.selectAll('.arc').attr('stroke-width',s(2));
 gArcs.selectAll('.cap-dot').attr('r',s(3.5)).attr('stroke-width',s(1.5));
}
const zoom=d3.zoom().scaleExtent([1,20]).on('zoom',e=>onZoom(e.transform));
svg.call(zoom).on('dblclick.zoom',null);
svg.on('click',()=>{if(sel){clearSel();showOverview()}});
const dur=RM?0:750;
$('#zin').onclick=()=>svg.transition().duration(RM?0:300).call(zoom.scaleBy,1.8);
$('#zout').onclick=()=>svg.transition().duration(RM?0:300).call(zoom.scaleBy,1/1.8);
$('#zreset').onclick=()=>svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity);
function flyTo(ll,k){const[x,y]=proj(ll);k=Math.max(1,Math.min(20,k));svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-x,-y))}
function flyToCountry(id){
 const f=byId.get(id);if(!f)return;const[[x0,y0],[x1,y1]]=path.bounds(f);const dx=x1-x0,dy=y1-y0;
 const cap=C[id]?.cap;
 if(dx>W*.6||!isFinite(dx)){flyTo(cap||d3.geoCentroid(f),2);return}
 let k=Math.min(8,.55/Math.max(dx/W,dy/H));k=Math.max(1.4,k);
 const cx=(x0+x1)/2,cy=(y0+y1)/2;
 svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-cx,-cy));
}

/* capas visibles */
function applyLayers(){
 lineG.attr('display',d=>ON.has(d.layer)?null:'none');
 mk.attr('display',d=>ON.has(d.layer)?null:'none');
}

/* tooltip */
const tipEl=$('#tip');
function tip(e,t,s){const r=wrap.getBoundingClientRect();tipEl.hidden=false;tipEl.innerHTML=esc(t)+(s?`<small>${esc(s)}</small>`:'');tipEl.style.left=(e.clientX-r.left)+'px';tipEl.style.top=(e.clientY-r.top)+'px'}
function hideTip(){tipEl.hidden=true}

/* bloques */
function setBloc(k){bloc=k;cb.value=k;const m=new Set(k?BLOCS[k].m:[]);countryPaths.classed('inbloc',f=>m.has(String(f.id)));renderLegend()}

/* selección de país y relaciones */
function capOf(id){if(C[id]?.cap)return C[id].cap;const f=byId.get(id);return f?d3.geoCentroid(f):null}
let HL=null;
function setHl(o){HL=o||null;const isL=HL&&HL.coords,isP=HL&&HL.ll;
 gLines.classed('focus',!!isL);lineG.classed('hl-g',d=>d===HL);
 gMk.classed('focus',!!isP);mk.classed('hl-m',d=>d===HL);
 if(isL)lineG.filter(d=>d===HL).raise();if(isP)mk.filter(d=>d===HL).raise();
 onZoom(curT)}
function flyToLine(d){const b=path.bounds({type:'LineString',coordinates:d.coords});const dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1];
 if(!isFinite(dx)||dx>W*.85){flyTo(d.coords[Math.floor(d.coords.length/2)],1.6);return}
 const k=Math.max(1,Math.min(7,.8/Math.max(dx/W,dy/H)));svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(b[0][0]+b[1][0])/2,-(b[0][1]+b[1][1])/2))}
function clearSel(){setHl(null);sel=null;countryPaths.attr('class','ctry').classed('inbloc',f=>bloc&&BLOCS[bloc].m.includes(String(f.id)));gArcs.selectAll('*').remove();mk.classed('on',false);lineG.selectAll('.ln').classed('hl',false)}
function relationsOf(id){
 if(C[id])return C[id].rel.map(r=>({id:r[0],t:r[1],n:r[2]}));
 const out=[];for(const[k,v]of Object.entries(C))for(const r of v.rel)if(r[0]===id)out.push({id:k,t:r[1],n:r[2],rev:true});return out;
}
function drawArcs(){
 gArcs.selectAll('*').remove();if(!sel||!proj)return;
 const a=capOf(sel);if(!a)return;const A=proj(a);
 for(const r of relationsOf(sel)){const b=capOf(r.id);if(!b)continue;const B=proj(b);
  const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,dx=B[0]-A[0],dy=B[1]-A[1],len=Math.hypot(dx,dy);
  const cx=mx-dy*.22,cy=my+dx*.22-len*.05;
  gArcs.append('path').attr('class','arc').attr('d',`M${A[0]},${A[1]}Q${cx},${cy} ${B[0]},${B[1]}`).attr('stroke',RT[r.t][1]).attr('opacity',.9);
  gArcs.append('circle').attr('class','cap-dot').attr('cx',B[0]).attr('cy',B[1]).style('fill',RT[r.t][1]);
 }
 gArcs.append('circle').attr('class','cap-dot').attr('cx',A[0]).attr('cy',A[1]);
 onZoom(curT);
}
function selectCountry(id,fly){
 clearSel();sel=id;hideTip();
 const rels=relationsOf(id),rm=new Map(rels.map(r=>[r.id,r.t]));
 countryPaths.each(function(f){const fid=String(f.id);const el=d3.select(this);if(fid===id)el.classed('sel',true);else if(rm.has(fid))el.classed('rel-'+rm.get(fid),true)});
 drawArcs();if(fly)flyToCountry(id);showCountry(id);
}

/* ---- panel ---- */
const P=$('#panel');
function blocsOf(id){return Object.entries(BLOCS).filter(([k,b])=>k!=='guerra'&&b.m.includes(id))}
function pointsIn(id){const f=byId.get(id);if(!f)return[];return PT.filter(p=>d3.geoContains(f,p.ll))}
function itemBtn(d,i){return `<button class="item" data-pt="${i}" style="--c:${ptColor(d)}"><i class="sw"></i><div><b>${esc(d.name)}</b><span>${esc(ptLabel(d))}</span></div></button>`}
function readsHtml(list,title){if(!list||!list.length)return'';return `<h3>${title||'Para profundizar'}</h3><ul class="reads">${list.map(([t,s,u])=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}<small>${esc(SRC[s])} ↗</small></a></li>`).join('')}</ul>`}
function factsHtml(d){if(!d||!d.length)return'';return `<h3>Datos clave</h3><dl class="facts">${d.map(([l,v,k])=>{const sr=DSRC[k];return `<div><dt>${esc(l)}</dt><dd>${esc(v)}<small>${sr[1]?`<a href="${esc(sr[1])}" target="_blank" rel="noopener">${esc(sr[0])} ↗</a>`:esc(sr[0])}</small></dd></div>`}).join('')}</dl>`}
function deepHtml(x){if(!x.deep)return'';return `<h3>${esc(x.deepT||'En detalle')}</h3><div class="deep">${x.deep.map(([t,b])=>`<div><b>${esc(t)}</b><p>${esc(b)}</p></div>`).join('')}</div><p class="deepnote">Contexto técnico general: sin fuente única enlazada.</p>`}
function extraHtml(x){let h='';if(x.act&&x.act.length)h+=`<h3>Actores clave</h3><div class="actors">${x.act.map(a=>`<span>${esc(a)}</span>`).join('')}</div>`;if(x.watch)h+=`<div class="watch"><b>Qué vigilar</b>${esc(x.watch)}</div>`;return h}
function detHtml(name,layer){const x=DET[name];let h='';if(x){h+=`<h3>Por qué importa</h3><p>${esc(x.why)}</p>`+deepHtml(x)+factsHtml(x.d)+extraHtml(x)}if(GUIDE[layer])h+=`<button class="guide-link" data-guide="${esc(layer)}">Por qué importan ${esc(GUIDE[layer].t.toLowerCase())} en general →</button>`;return h}
function layerColor(k){if(TECH[k])return`var(--t-${k})`;return k.startsWith('r:')?`var(--res-${k.slice(2)})`:{choke:'var(--choke)',sea:'var(--sea-route)',land:'var(--corr)',pipe:'var(--pipe)',cable:'var(--cable)'}[k]}
function gItem(kind,i,name,txt,col){return `<div class="gitem"><button class="item" data-${kind}="${i}" aria-expanded="false" style="--c:${col}"><i class="sw"></i><div><b>${esc(name)}</b><span>${esc(txt)}</span></div></button><div class="gdet" hidden></div></div>`}
function openGItem(btn){
 const isL=btn.dataset.gline!=null,obj=isL?LINE_DATA[+btn.dataset.gline]:PT[+btn.dataset.gpt],wrap=btn.parentElement,det=wrap.querySelector('.gdet');
 const was=btn.getAttribute('aria-expanded')==='true';
 P.querySelectorAll('.gitem button.item[aria-expanded="true"]').forEach(b=>{b.setAttribute('aria-expanded','false');b.parentElement.querySelector('.gdet').hidden=true});
 if(was){setHl(null);return}
 btn.setAttribute('aria-expanded','true');
 const x=DET[obj.name];det.innerHTML=(x?factsHtml(x.d).replace('<h3>Datos clave</h3>',''):'')+(x&&x.watch?`<div class="watch"><b>Qué vigilar</b>${esc(x.watch)}</div>`:'')+(x?`<p class="gdesc">${esc(obj.desc)}</p>`:'')+`<button class="guide-link" ${isL?`data-line="${+btn.dataset.gline}"`:`data-pt="${+btn.dataset.gpt}"`}>Abrir ficha completa →</button>`;det.hidden=false;
 setHl(obj);if(isL)flyToLine(obj);else flyTo(obj.ll,Math.max(K,3.5));
}
function limitsHtml(k){const L=LIMITS[k];if(!L)return'';return `<div class="lens-box"><p class="eyebrow">Mirada de los límites físicos · Antonio Turiel</p><p>${esc(L.txt)}</p>${factsHtml(L.d).replace('<h3>Datos clave</h3>','')}<div class="contra"><b>Contrapunto</b>${esc(L.contra)}</div><button class="guide-link" data-lens="limites">Ver la perspectiva completa →</button></div>`}
function ptByName(n){return PT.find(p=>p.name===n)}

function chartSvg(){

 g+=`<text x="${l+2}" y="${H-b+14}" class="axt">← El colapso es probable</text><text x="${W-r}" y="${H-b+14}" class="axt" text-anchor="end">La transición es posible →</text>`;
 g+=`<text x="${l-8}" y="${t}" class="axt" transform="rotate(-90 ${l-8} ${t})" text-anchor="end">Decrecer / romper con el modelo →</text><text x="${l-8}" y="${H-b}" class="axt" transform="rotate(-90 ${l-8} ${H-b})" text-anchor="start">← Crecer (mercado, tecnología)</text>`;
 const pts=vis.map(([a,i])=>({a,i,cx:X(a.x),cy:Y(a.y)}));
 const rects=pts.map(p=>({x0:p.cx-6,x1:p.cx+6,y0:p.cy-6,y1:p.cy+6}));
 const hit=(q)=>q.x0<l+1||q.x1>W-2||q.y0<2||q.y1>H-b-1||rects.some(z=>q.x0<z.x1&&z.x0<q.x1&&q.y0<z.y1&&z.y0<q.y1);
 const order=[...pts].sort((p,q)=>(p.a.s.length-q.a.s.length));
 for(const p of order){const w=p.a.s.length*5.6,c=[[8,4,'start'],[-8,4,'end'],[0,-9,'middle'],[0,16,'middle'],[7,-6,'start'],[7,13,'start'],[-7,-6,'end'],[-7,13,'end']];
  p.lab=null;for(const[dx,dy,an]of c){const x0=an==='start'?p.cx+dx:an==='end'?p.cx+dx-w:p.cx-w/2,q={x0,x1:x0+w,y0:p.cy+dy-9,y1:p.cy+dy+2};if(!hit(q)){rects.push(q);p.lab=[p.cx+dx,p.cy+dy,an];break}}}

 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de autores según diagnóstico y respuesta">${g}</svg>`}

 d3.select(mk.nodes()[PT.indexOf(d)]).classed('on',true);setHl(d);
 if(!ON.has(d.layer)){ON.add(d.layer);lay.querySelector(`[data-k="${d.layer}"]`)?.setAttribute('aria-pressed','true');applyLayers();renderLegend();saveOn()}
 if(fly)flyTo(d.ll,Math.max(K,d.layer==='hist'?3:4));
 const host=feats.find(f=>d3.geoContains(f,d.ll));
 let h=`<button class="back" data-act="home">← Resumen mundial</button><p class="eyebrow"><i class="sw" style="--c:${ptColor(d)}"></i>${esc(ptLabel(d))}</p><h2>${esc(d.name)}</h2>`;
 if(d.year)h+=`<p class="year">${esc(d.year)}</p>`;
 if(d.int)h+=`<p class="year" style="color:var(--war)">Intensidad ${esc(d.int)}</p>`;
 if(d.el)h+=`<p class="year" style="color:var(--vote)">${esc(fdate(d.el,1))} · ${esc(estatus(d.el))}</p>`;
 h+=`<p>${esc(d.desc)}</p>`;
 const rd=d.layer==='war'?RES_DIM[d.name]:d.layer==='tension'?RES_DIM_T[d.name]:null;
 if(rd)h+=`<div class="lens-box"><p class="eyebrow">Dimensión de recursos</p><p>${esc(rd)}</p><button class="guide-link" data-lens="recursos">Perspectiva: guerras por recursos →</button></div>`;
 h+=detHtml(d.name,d.layer);
 if(host)h+=`<h3>Territorio</h3><div class="cloud"><button data-c="${esc(String(host.id))}">${esc(nm(String(host.id)))}</button></div>`;
 if(d.el&&C[d.el.id])h+=`<h3>País</h3><div class="cloud"><button data-c="${esc(d.el.id)}">Ver ficha de ${esc(nm(d.el.id))}</button></div>`;
 const near=PT.filter(p=>p!==d&&ON.has(p.layer)&&d3.geoDistance(p.ll,d.ll)<.12).slice(0,6);
 h+=readsHtml(READ_LAYER[d.layer]);
 if(near.length)h+=`<h3>Cerca</h3><div class="items">${near.map(p=>itemBtn(p,PT.indexOf(p))).join('')}</div>`;
 P.innerHTML=h;P.scrollTop=0;
}
function showLine(d){
 clearSel();
 setHl(d);
 const lbl={sea:'Ruta marítima',land:'Corredor terrestre',pipe:d.sub==='gas'?'Gasoducto':d.sub==='off'?'Ducto fuera de servicio':d.sub==='plan'?'Ducto en proyecto':'Oleoducto',cable:'Cable submarino'}[d.layer];
 const col={sea:'var(--sea-route)',land:'var(--corr)',pipe:d.sub==='gas'||d.sub==='plan'?'var(--gaspipe)':'var(--pipe)',cable:'var(--cable)'}[d.layer];
 const crossed=[...new Set(d.coords.map(ll=>feats.find(f=>d3.geoContains(f,ll))).filter(Boolean).map(f=>String(f.id)))];
 const chokes=PT.filter(p=>p.layer==='choke'&&d.coords.some(ll=>d3.geoDistance(ll,p.ll)<.025));
 let h=`<button class="back" data-act="home">← Resumen mundial</button><p class="eyebrow"><i class="sw" style="--c:${col}"></i>${lbl}</p><h2>${esc(d.name)}</h2><p>${esc(d.desc)}</p>`+detHtml(d.name,d.layer);
 if(chokes.length)h+=`<h3>Pasa por</h3><div class="items">${chokes.map(p=>itemBtn(p,PT.indexOf(p))).join('')}</div>`;
 if(crossed.length)h+=`<h3>Países que toca</h3><div class="cloud">${crossed.map(id=>`<button data-c="${esc(id)}">${esc(nm(id))}</button>`).join('')}</div>`;
 h+=`<p class="meta">Trazado aproximado con fines de lectura, no de navegación.</p>`;
 P.innerHTML=h;P.scrollTop=0;
}
const REGIONS=[['América',['840','124','484','591','192','332','862','328','170','218','604','076','032','152','068']],['Europa',['826','250','276','724','380','616','804','643','112','792','300','246','752','578','208','304','688','Kosovo','348','440','642','498','196','620','528','051','031','268']],['Oriente Medio y Norte de África',['376','275','364','682','784','634','512','368','760','422','887','818','400','504','012','434']],['África subsahariana',['729','728','148','231','232','706','262','180','646','566','466','854','562','710']],['Asia y Pacífico',['156','158','392','410','408','356','586','004','050','144','104','764','116','704','608','458','702','360','036','398','860','795']]];
function elRow(e){const past=e.date<TODAY;return `<button class="${past?'past':''}" data-el="${EL.indexOf(e)}"><b>${esc(fdate(e,e.date.getFullYear()!==TODAY.getFullYear()))}</b><span>${esc(e.title)}<small>${esc(estatus(e))}</small></span></button>`}
function agendaHtml(){const up=EL.filter(e=>e.date>=TODAY),past=EL.filter(e=>e.date<TODAY).slice(-2);const first=[...past,...up.slice(0,6)],rest=up.slice(6);
 return `<div class="agenda">${first.map(elRow).join('')}</div>${rest.length?`<details class="more"><summary>Ver ${rest.length} citas más hasta finales de 2027</summary><div class="agenda">${rest.map(elRow).join('')}</div></details>`:''}`}
function showOverview(){
 let h=`<p class="eyebrow">Resumen · 31 oct 2026</p><h2>El tablero mundial hoy</h2><p class="lede">Toca cualquier país para ver qué le preocupa y con quién se alía o choca. Activa capas arriba para ver recursos, rutas, ductos, cables, bases e historia.</p><h3>Calendario electoral</h3>${agendaHtml()}<h3>Focos que mueven el mundo</h3><div class="items">${OVERVIEW.map((o,i)=>`<button class="item" data-ov="${i}" style="--c:var(--war)"><i class="sw"></i><div><b>${esc(o[0])}</b><span>${esc(o[1])}</span></div></button>`).join('')}</div>`;
 h+=`<h3>Perspectivas para leer el mundo</h3><p style="font-size:14px;color:var(--muted)">Cinco lecturas con su tesis, datos, contrapuntos y elementos del mapa.</p><div class="lenses">${Object.entries(LENSES).map(([k,l])=>`<button data-lens="${k}"><b>${esc(l.t)}</b><span>${esc(l.sub)}</span></button>`).join('')}</div>`;
 h+=`<h3>Flujos y recursos: por qué importan</h3><p style="font-size:14px;color:var(--muted)">Guías con su peso geopolítico y datos contrastados (EIA, IEA, USGS, UNCTAD, TeleGeography…).</p><p class="eyebrow" style="margin-top:10px">Flujos</p><div class="cloud">${['choke','sea','land','pipe','cable'].map(k=>`<button data-guide="${k}">${esc(GUIDE[k].t)}</button>`).join('')}</div><p class="eyebrow" style="margin-top:12px">Recursos</p><div class="cloud">${Object.keys(RES_TYPES).map(r=>`<button data-guide="r:${r}">${esc(GUIDE['r:'+r].t)}</button>`).join('')}</div>`;
 h+=`<h3>El año en diez claves</h3><p style="font-size:14px;color:var(--muted)">Según el CIDOB, estos temas marcan la agenda de 2026:</p><details class="more"><summary>Ver las diez claves</summary><ol class="temas">${CIDOB10.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details>`;
 h+=`<h3>Fichas de países</h3>${REGIONS.map(([r,ids])=>`<p class="eyebrow" style="margin-top:12px">${r}</p><div class="cloud">${ids.map(id=>`<button data-c="${esc(id)}">${esc(nm(id))}</button>`).join('')}</div>`).join('')}`;
 h+=`<h3>Colorea por alianza</h3><div class="blocs">${Object.entries(BLOCS).map(([k,b])=>`<button data-bloc="${k}">${esc(b.n)}</button>`).join('')}</div>`;
 h+=readsHtml(GLOBAL_READ,'Fuentes para seguir el mundo');
 h+=`<p class="meta">Última revisión: 31 de octubre de 2026 (resultado de Israel, Flávio Bolsonaro en Miami, Ormuz y Brent, refinerías y red eléctrica en Ucrania, intento de golpe en Níger, sanciones a Ruanda, Taiwán, Polonia y UCDP 2021). Revisión anterior: 26 de octubre de 2026. Revisión inicial el 25 de octubre de 2026 con Real Instituto Elcano, CIDOB, Foreign Affairs, Política Exterior, Le Monde diplomatique, Descifrando la Guerra y The Objective, además de informes públicos. Los conflictos cambian rápido: contrasta lo reciente con prensa actual. Trazados de rutas, ductos y cables simplificados. Fronteras: Natural Earth.</p>`;
 P.innerHTML=h;P.scrollTop=0;
}
P.addEventListener('click',e=>{const a=e.target.closest('.ubar a');if(a){e.preventDefault();P.querySelector(a.getAttribute('href'))?.scrollIntoView({behavior:RM?'auto':'smooth',block:'start'})}});
P.addEventListener('pointermove',e=>{if(e.target.closest('.thit'))tlPointer(e)});
P.addEventListener('pointerdown',e=>{if(e.target.closest('.thit'))tlPointer(e)});
P.addEventListener('pointerout',e=>{if(e.target.closest('.thit'))tlLeave(e)});
P.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest('[data-gline],[data-gpt]');if(!b)return;setHl(b.dataset.gline!=null?LINE_DATA[+b.dataset.gline]:PT[+b.dataset.gpt])});
P.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const b=e.target.closest('[data-gline],[data-gpt]');if(!b||b.contains(e.relatedTarget))return;const o=P.querySelector('.gitem button[aria-expanded="true"]');setHl(o?(o.dataset.gline!=null?LINE_DATA[+o.dataset.gline]:PT[+o.dataset.gpt]):null)});
P.addEventListener('click',e=>{const au=e.target.closest('.au');if(au){focusAuthor(+au.dataset.au);return}const df=e.target.closest('[data-dfilter]');if(df){DF=df.dataset.dfilter;P.querySelectorAll('[data-dfilter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dfilter===DF));const m=P.querySelector('#dmap');if(m)m.innerHTML=chartSvg()}});
P.addEventListener('keydown',e=>{const au=e.target.closest('.au');if(au&&(e.key==='Enter'||e.key===' ')){e.preventDefault();focusAuthor(+au.dataset.au)}});
P.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.act==='home'){clearSel();showOverview();svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity)}
 else if(t.dataset.c)selectCountry(t.dataset.c,true);
 else if(t.dataset.pt)showPoint(PT[+t.dataset.pt],true);
 else if(t.dataset.gline!=null||t.dataset.gpt!=null)openGItem(t);
 else if(t.dataset.tltab)showTimeline(t.dataset.tltab);
 else if(t.dataset.tl){const[a,b2]=t.dataset.tl.split(':');showTimeline(a,b2)}
 else if(t.dataset.guide)showGuide(t.dataset.guide);
 else if(t.dataset.lens)showLens(t.dataset.lens);
 else if(t.dataset.layeron){const k=t.dataset.layeron;if(!ON.has(k)){ON.add(k);lay.querySelector(`[data-k="${k}"]`)?.setAttribute('aria-pressed','true');applyLayers();renderLegend();saveOn()}svg.transition().duration(dur).call(zoom.transform,d3.zoomIdentity)}
 else if(t.dataset.line){const d=LINE_DATA[+t.dataset.line];showLine(d);flyTo(d.coords[Math.floor(d.coords.length/2)],2.2)}
 else if(t.dataset.el){const e=EL[+t.dataset.el];showPoint(PT.find(p=>p.el===e),true)}
 else if(t.dataset.bloc)setBloc(bloc===t.dataset.bloc?'':t.dataset.bloc);
 else if(t.dataset.ov){const o=OVERVIEW[+t.dataset.ov];flyTo(o[2],o[3]);const p=PT.find(p=>d3.geoDistance(p.ll,o[2])<.03);if(p)showPoint(p,false)}
});

/* ---- leyenda ---- */
function sym(k){
 const c={war:'<circle cx="8" cy="8" r="5" fill="var(--war)"/>',tension:'<path d="M8,2L14,13L2,13Z" fill="var(--tension)"/>',choke:'<path d="M8,1L15,8L8,15L1,8Z" fill="var(--choke)"/>',base:'<rect x="3" y="3" width="10" height="10" fill="var(--b-us)"/>',space:'<path transform="translate(8 8)" d="M0,-7L1.9,-2.4L6.7,-2.2L2.9,0.9L4.2,5.6L0,2.9L-4.2,5.6L-2.9,0.9L-6.7,-2.2L-1.9,-2.4Z" fill="var(--t-space)"/>',ai:'<path transform="translate(8 8)" d="M0,-6L5.2,-3L5.2,3L0,6L-5.2,3L-5.2,-3Z" fill="var(--t-ai)"/>',qc:'<circle cx="8" cy="8" r="5" fill="var(--panel)" stroke="var(--t-qc)" stroke-width="2"/><circle cx="8" cy="8" r="2" fill="var(--t-qc)"/>',cyber:'<path transform="translate(8 8)" d="M1.5,-7L-4.5,1L-0.5,1L-1.5,7L4.5,-1L0.5,-1Z" fill="var(--t-cyber)"/>',vote:'<rect x="2.5" y="2.5" width="11" height="11" rx="2.5" fill="var(--vote)"/><path d="M5.5,6.5H10.5" stroke="var(--panel)" stroke-width="1.6" stroke-linecap="round"/>',hist:'<circle cx="8" cy="8" r="4.5" fill="var(--panel)" stroke="var(--hist)" stroke-width="2.2"/>',sea:'<path d="M0,8H16" stroke="var(--sea-route)" stroke-width="2" stroke-dasharray="5 3"/>',land:'<path d="M1,8H16" stroke="var(--corr)" stroke-width="3" stroke-linecap="round" stroke-dasharray=".5 5"/>',pipe:'<path d="M0,5H16" stroke="var(--pipe)" stroke-width="2.2"/><path d="M0,11H16" stroke="var(--gaspipe)" stroke-width="2.2"/>',cable:'<path d="M0,8H16" stroke="var(--cable)" stroke-width="1.5"/>'}[k];
 return `<svg width="16" height="16" viewBox="0 0 16 16">${c||`<circle cx="8" cy="8" r="5" fill="var(--res-${k.slice(2)})"/>`}</svg>`;
}
function renderLegend(){
 const extra={vote:'Cita electoral (hueco: ya celebrada)',pipe:'Oleoducto / gasoducto (discontinuo: cerrado o en proyecto)',choke:'Cuello de botella (borde rojo: crítico)',war:'Conflicto (con pulso: alta intensidad)',base:'Bases: EEUU, China, Rusia, R. Unido/Francia…'};
 const items=[];for(const g of LAYERS)for(const[k,l]of g.items)if(ON.has(k))items.push(GUIDE[k]?`<li><button class="lgbtn" data-guide="${k}" title="Por qué importa">${sym(k)}<span>${esc(extra[k]||l)}</span><i>ⓘ</i></button></li>`:`<li>${sym(k)}${esc(extra[k]||l)}</li>`);
 let h=items.length?`<ul>${items.join('')}</ul>`:'<p style="margin:6px 0 0;color:var(--muted)">Ninguna capa activa.</p>';
 if(ON.has('base'))h+=`<div class="keyrow" style="margin-top:6px">${Object.values(OWN).map(([l,c])=>`<span style="--c:${c}"><i style="height:8px;width:8px;border-radius:1px"></i>${l}</span>`).join('')}</div>`;
 if(bloc)h+=`<div class="bdesc"><b style="color:var(--ink);font-family:var(--f-disp)">${esc(BLOCS[bloc].n)}</b> · ${esc(BLOCS[bloc].d)}</div>`;
 $('#legendBody').innerHTML=h;
}
$('#legendBody').addEventListener('click',e=>{const b=e.target.closest('[data-guide]');if(b)showGuide(b.dataset.guide)});
function __noop(){
}
if(innerWidth<600)$('#legend').open=false;

/* ---- búsqueda ---- */
const q=$('#q'),res=$('#results');
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const INDEX=[...feats.map(f=>({k:'c',id:String(f.id),n:nm(String(f.id)),s:C[f.id]?'Ficha':'País'})),...PT.map((p,i)=>({k:'p',i,n:p.name,s:ptLabel(p).split(' · ')[0]})),...LINE_DATA.map((l,i)=>({k:'l',i,n:l.name,s:{sea:'Ruta',land:'Corredor',pipe:'Ducto',cable:'Cable'}[l.layer]}))];
let hits=[],act=0;
function pick(h){res.hidden=true;q.value='';q.blur();if(h.k==='c')selectCountry(h.id,true);else if(h.k==='p')showPoint(PT[h.i],true);else{const d=LINE_DATA[h.i];if(!ON.has(d.layer)){ON.add(d.layer);lay.querySelector(`[data-k="${d.layer}"]`).setAttribute('aria-pressed','true');applyLayers();renderLegend()}showLine(d);flyTo(d.coords[Math.floor(d.coords.length/2)],2.2)}}
q.addEventListener('input',()=>{const v=norm(q.value.trim());if(!v){res.hidden=true;return}
 hits=INDEX.filter(x=>norm(x.n).includes(v)).sort((a,b)=>(norm(a.n).startsWith(v)?0:1)-(norm(b.n).startsWith(v)?0:1)||(a.s==='Ficha'?-1:0)).slice(0,10);act=0;
 res.innerHTML=hits.length?hits.map((h,i)=>`<button data-i="${i}" class="${i===0?'act':''}"><span>${esc(h.n)}</span><small>${esc(h.s)}</small></button>`).join(''):'<div style="padding:8px;color:var(--muted);font-family:var(--f-disp)">Sin resultados</div>';res.hidden=false});
q.addEventListener('keydown',e=>{if(res.hidden)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();act=(act+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;res.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('act',i===act))}else if(e.key==='Enter'&&hits[act]){pick(hits[act])}else if(e.key==='Escape')res.hidden=true});
res.addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();pick(hits[+b.dataset.i])}});
q.addEventListener('blur',()=>setTimeout(()=>res.hidden=true,150));

/* ---- arranque ---- */
applyLayers();renderLegend();showOverview();render();
new ResizeObserver(()=>{clearTimeout(window.__rt);window.__rt=setTimeout(render,120)}).observe(wrap);
})();
</script>

</body></html>
